name: Stage inspect

# Temporary diagnostic workflow: lists staged npm publishes for
# @rockshin/tao-icons (uses the repo NPM_TOKEN secret). Delete after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/icons
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: List staged versions
        run: |
          npm install --global npm@11 >/dev/null
          npm --version
          npm stage list
          echo '--- json ---'
          npm stage list --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
