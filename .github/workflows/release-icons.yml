name: Release icons

# Publishes @rockshin/tao-icons to npm.
#
# Trigger: a *published GitHub Release* whose tag is `icons-v<version>`. The
# tag must match `packages/icons/package.json`; creating the Release is the
# explicit publish authorization step.
#
# Authentication: npm trusted publishing (OIDC). Before the first release, the
# package owner must add a trusted publisher on npmjs.com for this repository and
# the workflow file name `release-icons.yml`.
#
# Bootstrap exception: npm can only exchange the OIDC token for a package that
# already has a trusted publisher, so the *first* publish falls back to the repo
# `NPM_TOKEN` secret (the same token used by the tao-ui release). Once the first
# version exists and the trusted publisher is configured on npmjs.com, the
# NODE_AUTH_TOKEN line below can be removed; OIDC then takes over.
#
# Provenance: the repository is currently private and npm provenance requires a
# public repository, so publishing intentionally omits `--provenance` for now.
# Restore it together with OIDC once the repo is made public.
#
# Note: `npm publish` runs the package's own lifecycle scripts
# (`prepack` -> check:fast and `prepublishOnly` -> release:check + check:extended),
# so the full real-tarball consumer gate also runs here. That is why this job
# gets a large timeout.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-icons
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @rockshin/tao-icons
    if: startsWith(github.event.release.tag_name, 'icons-v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/icons
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # registry-url writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # to .npmrc so the bootstrap token below is actually used. OIDC can
      # replace this once a trusted publisher exists for the package.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        # npm >= 11.5.1 is required for OIDC trusted publishing.
        run: |
          npm install --global npm@11
          npm --version

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "icons-v$PKG" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match packages/icons/package.json version 'icons-v$PKG'. Bump the version before releasing."
            exit 1
          fi

      - name: Fast package gate
        run: bun run check:fast

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Bootstrap only: lets the very first publish through before a
          # trusted publisher can be configured for this package on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
