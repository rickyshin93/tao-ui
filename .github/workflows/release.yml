name: Release

# Publishes @rockshin/tao-ui to npm. The publish trigger is a *published GitHub
# Release* with tag `v<version>` (created by `bun run release <version>`), not a
# tag push. icon releases (`icons-v...`) are handled by release-icons.yml and
# are skipped here.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish @rockshin/tao-ui
    if: startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'icons-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/tao-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # setup-node writes a temporary .npmrc wired to NODE_AUTH_TOKEN and pins
      # the registry; npm reads it through NPM_CONFIG_USERCONFIG from any cwd.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PKG" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match packages/tao-ui/package.json version 'v$PKG'. Bump the version before releasing."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check public types
        run: bun run test:types

      - name: Check component registry
        run: bun run check:components

      - name: Check generated docs
        run: bun run docs:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check package exports
        run: bun run test:package

      - name: Build Storybook
        run: bun run build:storybook

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
