name: Rspress Pages

# Builds packages/tao-ui/docs with Rspress and deploys the output to GitHub
# Pages. Rspress writes its static site to packages/tao-ui/doc_build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: packages/tao-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build Rspress
        run: bun run doc:build
        env:
          RSPRESS_BASE: /tao-ui/
          RSPRESS_SITE_ORIGIN: https://rickyshin93.github.io

      # Actions ignore run-step working-directory, so the artifact path is
      # repo-root relative.
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/tao-ui/doc_build

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
